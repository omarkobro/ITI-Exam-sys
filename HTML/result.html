<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam Result Page</title>
    <link rel="stylesheet" href="../src/output.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body class="bg-gray-200 min-h-screen flex items-center justify-center p-4">
    <!-- Main Container -->
    <div class="w-full max-w-3xl">
      <!-- Header -->
      <div class="mb-6">
        <h1 class="text-white text-lg font-medium">Exam Result Page</h1>
      </div>

      <!-- Result Card -->
      <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
        <!-- Orange Top Border -->
        <div class="bg-gradient-to-r from-orange-400 to-yellow-400 h-2"></div>

        <!-- Card Content -->
        <div class="p-8 md:p-12">
          <!-- Profile Section -->
          <div class="flex flex-col items-center mb-8">
            <!-- Profile Picture -->
            <div class="relative mb-4">
              <div
                class="w-20 h-20 bg-gray-400 rounded-full flex items-center justify-center"
              >
                <i class="fas fa-user text-white text-4xl"></i>
              </div>
              <!-- Online Indicator -->
              <div
                class="absolute bottom-0 right-0 w-5 h-5 bg-green-500 rounded-full border-4 border-white"
              ></div>
            </div>

            <!-- Student Info -->
            <h2 id="userName" class="text-2xl font-bold text-gray-900 mb-1">
              Alexander Pierce
            </h2>
          </div>

          <!-- Score Section -->
          <div class="text-center mb-8">
            <p class="text-orange-500 text-xs font-bold tracking-wider mb-3">
              FINAL SCORE
            </p>
            <div class="mb-4">
              <span
                id="mainScore"
                class="text-7xl md:text-8xl font-bold text-gray-900"
                >92</span
              >
              <span
                id="totalScore"
                class="text-4xl md:text-5xl font-light text-gray-400"
                >/100</span
              >
            </div>

            <!-- Performance Badge -->
            <div
              id="performance-badge"
              class="inline-flex items-center gap-2 bg-green-50 text-green-600 px-4 py-2 rounded-full"
            >
              <i class="fas fa-check-circle text-lg"></i>
              <span class="font-semibold text-sm">Excellent Performance</span>
            </div>
          </div>

          <!-- Stats Cards -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <!-- Time Taken Card -->
            <div class="bg-gray-50 rounded-xl p-6 text-center">
              <div
                class="bg-blue-100 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3"
              >
                <i class="fas fa-clock text-blue-600 text-2xl"></i>
              </div>
              <p id="timeTaken" class="text-3xl font-bold text-gray-900 mb-1">
                42 <span class="text-xl font-normal text-gray-500">min</span>
              </p>
              <p class="text-xs text-gray-500 uppercase tracking-wide">
                Time Taken
              </p>
            </div>

            <!-- Percentage Card -->
            <div class="bg-gray-50 rounded-xl p-6 text-center">
              <div
                class="bg-orange-100 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3"
              >
                <i class="fas fa-check-circle text-orange-600 text-2xl"></i>
              </div>
              <p id="percentage" class="text-3xl font-bold text-gray-900 mb-1">
                92 <span class="text-xl font-normal text-gray-500">%</span>
              </p>
              <p class="text-xs text-gray-500 uppercase tracking-wide">
                Percentage
              </p>
            </div>
          </div>

          <!-- Action Button -->
          <div class="flex justify-center mb-6">
            <button
              id="doneBtn"
              class="bg-orange-500 hover:bg-orange-600 text-white font-semibold px-8 py-3 rounded-lg flex items-center gap-2 transition shadow-lg cursor-pointer"
            >
              Done
              <i class="fas fa-arrow-right"></i>
            </button>
          </div>

          <!-- Footer Info -->
          <div
            class="flex flex-col md:flex-row justify-between items-center text-xs text-gray-400 pt-6 border-t border-gray-100 gap-2"
          >
            <p>Advanced English Composition - Exam 04</p>
            <p id="resultDate">Completed on Oct 24, 2023</p>
          </div>
        </div>
      </div>
    </div>

    <script src="../JS/constants.js"></script>
    <script src="../JS/examTimer.js"></script>
    <script src="../JS/storage.js"></script>
    <script src="../js/result.js"></script>
  </body>
</html>
